name: Cleanup old Actions artifacts

# Reclaims GitHub Actions storage by deleting workflow artifacts.
# The Pages deploy only needs the most recent build artifact, so anything
# older is safe to remove. Runs daily and can be triggered manually.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than 1 day
        uses: actions/github-script@v7
        with:
          script: |
            const maxAgeMs = 24 * 60 * 60 * 1000; // 1 day
            const now = Date.now();
            let deleted = 0;
            let bytesFreed = 0;

            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            for (const artifact of artifacts) {
              const age = now - new Date(artifact.created_at).getTime();
              if (age > maxAgeMs) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                deleted++;
                bytesFreed += artifact.size_in_bytes || 0;
                core.info(`Deleted "${artifact.name}" (#${artifact.id})`);
              }
            }

            core.info(`Done. Deleted ${deleted} artifact(s), freed ${(bytesFreed / 1e6).toFixed(2)} MB.`);
